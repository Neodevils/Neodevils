<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>kaeru.</title>
        <link
            rel="stylesheet"
            href="../css/project-1.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    </head>
    <body>
        <a
            href="../index.html"
            class="back">
            <span>Back</span>
        </a>

        <div class="project-container">
            <div class="project-content">
                <div class="video-section">
                    <video
                        autoplay
                        muted
                        playsinline
                        loop
                        poster="../public/assets/images/kaeru.webp">
                        <source
                            src="../public/assets/videos/kaeru.mp4"
                            type="video/mp4" />
                        Your browser does not support the video tag.
                    </video>
                </div>

                <div class="info-section">
                    <div class="info-content">
                        <div class="project-header">
                            <div class="project-used-by">
                                <span>Used by</span>
                                <div class="users">
                                    <img
                                        src="../public/assets/images/trusted/1.webp"
                                        alt="User 1"
                                        width="50px"
                                        height="50px" />
                                    <img
                                        src="../public/assets/images/trusted/2.webp"
                                        alt="User 2"
                                        width="50px"
                                        height="50px" />
                                    <img
                                        src="../public/assets/images/trusted/3.webp"
                                        alt="User 3"
                                        width="50px"
                                        height="50px" />
                                </div>
                                <span>200+ users</span>
                                <span>and</span>
                                <div class="servers">
                                    <img
                                        src="../public/assets/images/trusted/4.webp"
                                        alt="secret" />
                                    <img
                                        src="../public/assets/images/trusted/5.webp"
                                        alt="secret" />
                                </div>
                                <span>over 40+ servers</span>
                            </div>
                            <h1 class="project-title">Kaeru</h1>
                            <p class="project-subtitle">A Discord Bot with Pro-Ticket System</p>
                            <div class="command-tags">
                                <span class="command-tag"
                                    >Translate Message (ephemeral)</span
                                >
                                <span class="command-tag">/setup ticket</span>
                                <span class="command-tag">/warn</span>
                                <span class="command-tag">User Avatar</span>
                            </div>

                            <div class="ticket-timeline">
                                <div class="timeline-item">
                                    <div class="timeline-dot">
                                        <div class="timeline-icon">
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                viewBox="0 0 24 24"
                                                width="16"
                                                height="16">
                                                <path
                                                    d="M3 3H21C21.5523 3 22 3.44772 22 4V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V4C2 3.44772 2.44772 3 3 3ZM20 11H4V19H20V11ZM20 9V5H4V9H20ZM9 13H7V17H9V13ZM15 13H17V17H15V13ZM12 13H14V17H12V13Z"
                                                    fill="currentColor"></path>
                                            </svg>
                                        </div>
                                    </div>
                                    <div class="timeline-text">
                                        <span
                                            ><strong>Aiden</strong> has created
                                            a ticket.</span
                                        >
                                    </div>
                                </div>
                                <div class="timeline-item">
                                    <div class="timeline-dot">
                                        <div class="timeline-icon">
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                viewBox="0 0 24 24"
                                                width="16"
                                                height="16">
                                                <path
                                                    d="M17.841 15.659L18.017 15.836L18.1945 15.659C19.0732 14.7803 20.4978 14.7803 21.3765 15.659C22.2552 16.5377 22.2552 17.9623 21.3765 18.841L18.0178 22.1997L14.659 18.841C13.7803 17.9623 13.7803 16.5377 14.659 15.659C15.5377 14.7803 16.9623 14.7803 17.841 15.659ZM12 14V16C8.68629 16 6 18.6863 6 22H4C4 17.5817 7.58172 14 12 14ZM12 1C15.866 1 19 4.13401 19 8C19 11.866 15.866 15 12 15C8.13401 15 5 11.866 5 8C5 4.13401 8.13401 1 12 1ZM12 3C9.23858 3 7 5.23858 7 8C7 10.7614 9.23858 13 12 13C14.7614 13 17 10.7614 17 8C17 5.23858 14.7614 3 12 3Z"
                                                    fill="currentColor"></path>
                                            </svg>
                                        </div>
                                    </div>
                                    <div class="timeline-text">
                                        <span
                                            ><strong
                                                style="
                                                    color: rgb(62, 219, 219);
                                                ">
                                                @Ita</strong
                                            >
                                            joined.</span
                                        >
                                    </div>
                                </div>
                                <div class="timeline-item">
                                    <div class="timeline-dot">
                                        <div class="timeline-icon">
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                viewBox="0 0 24 24"
                                                width="16"
                                                height="16">
                                                <path
                                                    d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11.0026 16L6.75999 11.7574L8.17421 10.3431L11.0026 13.1716L16.6595 7.51472L18.0737 8.92893L11.0026 16Z"
                                                    fill="currentColor"></path>
                                            </svg>
                                        </div>
                                    </div>
                                    <div class="timeline-text">
                                        <span
                                            >Ticket closed as
                                            <strong
                                                style="
                                                    color: #8e67e9;
                                                    text-decoration: underline;
                                                    text-decoration-style: dotted;
                                                    text-underline-offset: 2px;
                                                ">
                                                done</strong
                                            >
                                            5 minutes ago.</span
                                        >
                                    </div>
                                </div>
                                <div class="timeline-item">
                                    <div class="timeline-dot">
                                        <div class="timeline-icon">
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                viewBox="0 0 24 24"
                                                width="16"
                                                height="16">
                                                <path
                                                    d="M11 11V5H13V11H19V13H13V19H11V13H5V11H11Z"
                                                    fill="currentColor"></path>
                                            </svg>
                                        </div>
                                    </div>
                                    <div class="timeline-text">
                                        <span
                                            >Try it yourself by
                                            <button class="timeline-button">
                                                installing Kaeru
                                            </button>
                                            today!</span
                                        >
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div
                            class="popup-container"
                            id="popup-container">
                            <div class="popup-content">
                                <div class="popup-header">
                                    <h3>Try Kaeru today with...</h3>
                                    <button
                                        class="popup-close"
                                        id="popup-close">
                                        &times;
                                    </button>
                                </div>
                                <div class="popup-buttons">
                                    <button class="popup-btn primary-btn">
                                        <img
                                            class="btn-icon"
                                            src="../public/assets/icons/discord.svg"
                                            alt="Discord Icon" />
                                        <span>Installing her</span>
                                    </button>
                                    <button class="popup-btn secondary-btn">
                                        <img
                                            class="btn-icon"
                                            src="../public/assets/icons/support.svg"
                                            alt="Support Icon" />
                                        <span>Going to Support Server</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="album-cards">
                            <img
                                src="../public/assets/images/kaeru/1.webp"
                                alt="Album 1" />
                            <img
                                src="../public/assets/images/kaeru/2.webp"
                                alt="Album 2" />
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="../js/project-1.js"></script>
    </body>
</html>
