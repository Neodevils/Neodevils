<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta content="Neodevil" property="og:title" />
        <meta
            content="This is my personal website."
            property="og:description"
        />
        <meta content="https://neoaichan.me" property="og:url" />
        <meta content="./public/assets/logo.png" property="og:image" />
        <meta content="#ffae74" data-react-helmet="true" name="theme-color" />
        <meta name="msapplication-TileColor" content="#ffffff" />
        <meta name="msapplication-TileImage" content="/ms-icon-144x144.png" />
        <meta name="theme-color" content="#ffffff" />

        <title>Neo</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="screen">
            <header>
                <img
                    class="icons springish"
                    width="25px"
                    src="./public/assets/icons/projective.svg"
                    alt=""
                />
                <div class="dynamic-header springish">
                    <img
                        class="springish"
                        width="25px"
                        src="/public/assets/icons/waveform.svg"
                        alt=""
                    />
                </div>
                <img
                    class="icons springish"
                    width="25px"
                    src="./public/assets/icons/sun.dust.svg"
                    alt=""
                />
            </header>

            <main>
                <section class="neo">
                    <div class="information">
                        <img
                            class="springish"
                            src="./public/assets/neo.jpeg"
                            alt=""
                        />
                        <span class="followers"
                            ><strong>25</strong> Takipçi</span
                        >
                        <h1 class="springish">
                            <span class="gloock">İbrahim</span> Güneş
                        </h1>
                        <div class="titles">
                            <span class="title springish"
                                ><img
                                    width="15px"
                                    src="./public/assets/icons/wrench.and.screwdriver.svg"
                                    alt=""
                                />Geliştirici</span
                            >

                            <span class="title springish">
                                <img
                                    width="15px"
                                    src="./public/assets/icons/camera.metering.multispot.svg"
                                    alt=""
                                />
                                Haritacı</span
                            >
                            <span class="title springish"
                                ><img
                                    width="15px"
                                    src="./public/assets/icons/pencil.and.scribble.svg"
                                    alt=""
                                />Artist</span
                            >
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
